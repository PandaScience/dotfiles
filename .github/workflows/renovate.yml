name: Renovate

on:
  schedule:
    - cron: "0 8 * * 5" # every Friday at 08:00 UTC
  workflow_dispatch: # allow manual runs

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          # required permissions: https://docs.renovatebot.com/modules/platform/github/#running-as-a-github-app
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: renovatebot/github-action@3064367f740a1a91cca218698a63902689cce200 # v46.1.20
        with:
          configurationFile: .github/renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          # LOG_LEVEL: debug
          RENOVATE_PLATFORM_COMMIT: "true"
          RENOVATE_AUTODISCOVER: "true"
