name: Renovate

on:
  schedule:
    - cron: "0 8 * * 5" # every Friday at 08:00 UTC
  workflow_dispatch: # allow manual runs

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          # required permissions: https://docs.renovatebot.com/modules/platform/github/#running-as-a-github-app
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: renovatebot/github-action@b50d2ba2bd928235abdcc14d06dfafc217f1c565 # v46.1.18
        with:
          configurationFile: .github/renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          # LOG_LEVEL: debug
          RENOVATE_PLATFORM_COMMIT: "true"
          RENOVATE_AUTODISCOVER: "true"
