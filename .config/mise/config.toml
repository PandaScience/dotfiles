"aqua:fluxcd/flux2" = "2.9.5"
"aqua:istio/istio/istioctl" = "1.31.0"
"aqua:crossplane/crossplane" = "2.4.0"
"github:vitobotta/hetzner-k3s" = "2.6.0"
"aqua:kubernetes-sigs/kubebuilder" = "4.15.0"
"aqua:kubernetes-sigs/kind" = "0.33.0"
"aqua:kyverno/kyverno" = "1.19.0"
"aqua:vmware-tanzu/velero" = "1.18.2"
"npm:@devcontainers/cli" = "0.89.0"
"aqua:homeport/dyff" = "1.12.0"
"aqua:koalaman/shellcheck" = "0.11.0"
