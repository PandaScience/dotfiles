[settings]
experimental = true

[env]
TRIVY_IGNOREFILE = "~/.config/trivy/.trivyignore"
# check https://nono.sh/docs/cli/clients/claude-code#multiple-claude-profiles-claude_config_dir
CLAUDE_CONFIG_DIR = "~/Claude/.claude"

[shell_alias]
# claude = "nono run --dry-run -v --allow-cwd --profile claude-custom -- claude"
# claude = "nono run --allow-cwd --profile claude-custom -- claude"
# oc = "nono run --allow-cwd --profile opencode-custom -- opencode"
claude = "mise run claude"

[tasks.claude]
run = "nono run --allow-cwd --profile claude-custom -- claude"
dir = "~/Claude"

# NOTE: enable this only in local configs, comes with performance penalty!
# https://mise.jdx.dev/configuration.html#idiomatic-version-files
# idiomatic_version_file_enable_tools = ["terraform", "opentofu", "python"]

[tools]
# required for auto-completion by mise itself
"aqua:jdx/usage" = "3.5.4"

# ai
"aqua:anthropics/claude-code" = "2.1.206"
"aqua:anomalyco/opencode" = "1.17.18"
"github:always-further/nono" = "0.67.1"
"github:earendil-works/pi" = "0.80.6"

# go
# pkgsite has no git tags or releases, so we have to use the latest version
"go:golang.org/x/pkgsite/cmd/pkgsite" = "latest"
"go:github.com/kisielk/errcheck" = "1.20.0"
"go:golang.org/x/tools/cmd/goimports" = "0.43.0"

# misc
"pipx:zmk" = "0.4.1"
"npm:@fsouza/prettierd" = "0.28.0"
"aqua:sachaos/viddy" = "1.3.1"
"aqua:deviceinsight/kafkactl" = "5.19.0"
"aqua:oras-project/oras" = "1.3.2"
"github:lindell/multi-gitter" = "0.63.1"

# esoterics
"aqua:kcl-lang/cli" = "0.12.4"
# "aqua:kcl-lang/kcl" = "latest" # https://github.com/kcl-lang/kcl.nvim/issues/18

# cloud
"aqua:aws/aws-cli" = "2.35.20"

# IaC
"aqua:hashicorp/terraform" = "1.15.8"
"aqua:opentofu/opentofu" = "1.12.3"
"github:busser/tfautomv" = "0.7.0"
"aqua:terraform-docs/terraform-docs" = "0.24.0"

# k8s
"aqua:kubernetes/kubernetes/kubectl" = "1.36.2"
"aqua:kubecolor/kubecolor" = "0.6.0"
"aqua:danielfoehrKn/kubeswitch" = "0.9.3"
"aqua:kubernetes-sigs/krew" = "0.5.0"
"aqua:derailed/k9s" = "0.51.0"
"aqua:argoproj/argo-cd" = "3.4.5"
"aqua:fluxcd/flux2" = "2.9.1"
"aqua:istio/istio/istioctl" = "1.30.2"
"aqua:crossplane/crossplane" = "2.3.3"
"github:vitobotta/hetzner-k3s" = "2.6.0"
"aqua:kubernetes-sigs/kubebuilder" = "4.15.0"
"aqua:kubernetes-sigs/kind" = "0.32.0"
"aqua:kyverno/kyverno" = "1.18.2"
"aqua:vmware-tanzu/velero" = "1.18.2"
"npm:@devcontainers/cli" = "0.87.0"
"aqua:homeport/dyff" = "1.12.0"
"aqua:koalaman/shellcheck" = "0.11.0"
